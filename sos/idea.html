<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="wrap single">
  <nav class="site-nav" id="siteNav" data-page="idea" aria-label="메뉴"></nav>
  <main>
    <section class="sec idea-sec">
      <h2>🙈 익명게시판</h2>
      <p class="hint idea-note"><b>닉네임 없이 익명으로</b> 올라가요. <span class="nw">🤫 <b>방장도 누가 썼는지 몰라요.</b></span><br><span class="nw">💬 수다·고민, 🧺 피크닉·나들이,</span> <span class="nw">📚 독서, 🛒 공구, 💡 꿀팁까지</span><br><span class="nw">말머리 골라서 편하게 이야기해 주세요 🙂</span><br><span class="nw">👥 우리 방만 봐요 · 🗑 <b>3일 뒤</b> 자동 삭제</span></p>
      <button type="button" class="btn primary block" id="ideaOpen">✏️ 글 쓰기</button>
      <form class="idea-form" id="ideaForm" hidden>
        <div class="idea-cats" id="ideaCats" role="group" aria-label="말머리"></div>
        <input type="text" id="ideaTitle" maxlength="40" placeholder="제목 (예: 요즘 밤잠 어떻게 재우세요?)" aria-label="제목">
        <textarea id="ideaBody" maxlength="1000" rows="5" placeholder="고민·하소연·제안, 뭐든 자유롭게 적어 주세요. 이름·연락처 같은 개인정보는 빼 주세요." aria-label="내용"></textarea>
        <div id="ideaAttach"></div>
        <div class="idea-row"><span class="hint" id="ideaCount">0 / 1000</span><button type="button" class="btn" id="ideaCancel">취소</button><button type="submit" class="btn primary" id="ideaSend">익명으로 올리기</button></div>
      </form>
      <ul class="idea-list" id="ideaList"><li class="hint">불러오는 중…</li></ul>
    </section>
    <p class="tiny-note">🙈 쓴 사람이 누구인지 서버에도 남지 않아요.<br><span class="nw">(닉네임·로그인 번호 저장 안 함)</span><br>내 글은 <b>쓴 휴대폰</b>에서만 지울 수 있어요.<br>비방·개인정보가 담긴 글은 <b>방장</b>이 지울 수 있어요.</p>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

</body>
</html>
