<body>
<div class="wrap single">
  <nav class="site-nav" id="siteNav" data-page="idea" aria-label="메뉴"></nav>
  <main>
    <section class="sec idea-sec">
      <h2>💡 익명 제안함</h2>
      <p class="hint idea-note"><b>닉네임 없이 익명으로</b> 올라가요.<br><span class="nw">얼굴 붉힐 걱정 없이,</span> <span class="nw">마음 편하게 이야기해 주세요 🙂</span><br><span class="nw">👥 우리 방만 봐요</span> · <span class="nw">🗑 <b>30일 뒤</b> 자동 삭제</span></p>
      <button type="button" class="btn primary block" id="ideaOpen">✏️ 제안 쓰기</button>
      <form class="idea-form" id="ideaForm" hidden>
        <input type="text" id="ideaTitle" maxlength="40" placeholder="제목 (예: 모임 시간을 오전으로 해 보면 어때요?)" aria-label="제목">
        <textarea id="ideaBody" maxlength="1000" rows="5" placeholder="하고 싶은 말을 편하게 적어 주세요. 이름·연락처 같은 개인정보는 빼 주세요." aria-label="내용"></textarea>
        <div class="idea-row"><span class="hint" id="ideaCount">0 / 1000</span><button type="button" class="btn" id="ideaCancel">취소</button><button type="submit" class="btn primary" id="ideaSend">익명으로 올리기</button></div>
      </form>
      <ul class="idea-list" id="ideaList"><li class="hint">불러오는 중…</li></ul>
    </section>
    <p class="tiny-note">🙈 쓴 사람이 누구인지 서버에도 남지 않아요 (닉네임·로그인 번호 저장 안 함).<br>내 글은 <b>쓴 휴대폰</b>에서만 지울 수 있고, 비방·개인정보가 담긴 글은 <b>방장</b>이 지울 수 있어요.</p>
  </main>
</div>

<script src="assets/push.js?v=202610141016"></script>
<script src="assets/idea.js?v=202610141016"></script>
</body>
</html>
