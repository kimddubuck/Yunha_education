<!doctype html>
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>보안 규칙 복사</title>
<style>
:root{--bg:#16191b;--fg:#e8ecea;--line:#3a4044;--pick:#e9ebee;--pick-fg:#15181a}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
h1{font-size:20px;margin:0 0 6px} p{margin:0 0 12px;font-size:14px;line-height:1.6}
label{display:block;font-size:14px;font-weight:700;margin:8px 0 6px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:#1f2326;color:var(--fg);font:15px monospace}
button{width:100%;padding:16px;border:0;border-radius:14px;background:var(--pick);color:var(--pick-fg);font-size:17px;font-weight:700;margin-top:12px}
textarea{width:100%;box-sizing:border-box;height:45vh;margin-top:12px;font:12px/1.4 monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--fg)}
#ok{text-align:center;font-weight:700;min-height:1.4em;margin-top:8px}
</style></head><body>
<h1>🔐 Firestore 보안 규칙 v15 (운영자용)</h1>
<p>① 아래 칸에 <b>내 번호</b>(admin.html 에 보이는 번호)를 넣고<br>② 버튼을 누르면 규칙 <b>전체(368줄)</b>가 복사돼요.<br>③ Firebase 콘솔 규칙 칸을 <b>모두 지우고</b> 붙여넣은 뒤 <b>게시</b>하세요.<br>⚠️ 콘솔에서 따옴표를 직접 고치지 마세요 (따옴표가 두 개로 들어가 오류가 나요).<br>마지막 줄이 <code>}</code> 로 끝나는지 확인해 주세요.</p>
<label for="uid">내 번호 (운영자)</label>
<input id="uid" autocomplete="off" spellcheck="false" placeholder="예: AbCd1234...">
<button id="copy">📋 규칙 전체 복사하기</button>
<p id="line28" style="font:12px/1.5 monospace;word-break:break-all;background:#1f2326;border-radius:10px;padding:8px;margin:10px 0 0"></p>
<p id="ok" aria-live="polite"></p>
<textarea id="t" readonly>rules_version = &#x27;2&#x27;;
service cloud.firestore {
  match /databases/{database}/documents {
    function expireOk(d) {
      return !(&#x27;expireAt&#x27; in d) || (d.expireAt is timestamp &amp;&amp; d.expireAt &lt;= request.time + duration.value(20, &#x27;d&#x27;));
    }
    function expired() {
      return resource.data.get(&#x27;expireAt&#x27;, null) is timestamp &amp;&amp; resource.data.expireAt &lt; request.time;
    }
    function roomDeleted(roomKey) {
      return get(/databases/$(database)/documents/rooms/$(roomKey)).data.get(&#x27;deleted&#x27;, false) == true;
    }
    function roomAlive(roomKey) {
      return exists(/databases/$(database)/documents/rooms/$(roomKey))
        &amp;&amp; get(/databases/$(database)/documents/rooms/$(roomKey)).data.get(&#x27;deleted&#x27;, false) == false;
    }
    function meDoc(roomKey) { return /databases/$(database)/documents/rooms/$(roomKey)/members/$(request.auth.uid); }
    function isMember(roomKey) {
      return request.auth != null &amp;&amp; exists(meDoc(roomKey)) &amp;&amp; get(meDoc(roomKey)).data.get(&#x27;on&#x27;, false) == true;
    }
    function canUse(roomKey) { return roomAlive(roomKey) &amp;&amp; isMember(roomKey); }
    function myNick(roomKey) { return get(meDoc(roomKey)).data.nick; }
    function isOwner(roomKey) {
      return request.auth != null &amp;&amp; get(/databases/$(database)/documents/rooms/$(roomKey)).data.get(&#x27;ou&#x27;, &#x27;&#x27;) == request.auth.uid;
    }
    function nickOk(n) { return n is string &amp;&amp; n.size() &gt;= 1 &amp;&amp; n.size() &lt;= 20; }
    function isAdmin() {
      return request.auth != null &amp;&amp; request.auth.uid in [&#x27;여기에_내_번호&#x27;];
    }
    function ownerGone(roomKey, ou) {
      let p = /databases/$(database)/documents/rooms/$(roomKey)/members/$(ou);
      return !exists(p) || get(p).data.get(&#x27;on&#x27;, false) == false
        || get(p).data.get(&#x27;seen&#x27;, get(p).data.joinedAt) &lt; request.time - duration.value(60, &#x27;d&#x27;);
    }
    match /stats/{day} {
      allow read: if isAdmin();
      allow create: if day.matches(&#x27;^20[0-9]{2}-[01][0-9]-[0-3][0-9]$&#x27;)
        &amp;&amp; request.resource.data.keys().hasOnly([&#x27;p&#x27;, &#x27;v&#x27;])
        &amp;&amp; request.resource.data.p == 1 &amp;&amp; request.resource.data.v in [0, 1];
      allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;p&#x27;, &#x27;v&#x27;])
        &amp;&amp; request.resource.data.p == resource.data.p + 1
        &amp;&amp; request.resource.data.v in [resource.data.v, resource.data.v + 1];
    }
    match /rooms/{roomKey} {
      allow get: if true;
      allow list: if isAdmin();
      allow delete: if isAdmin() &amp;&amp; resource.data.get(&#x27;deleted&#x27;, false) == true;
      allow create: if roomKey.matches(&#x27;^[0-9a-f]{64}$&#x27;)
        &amp;&amp; request.resource.data.keys().hasOnly([&#x27;name&#x27;, &#x27;oh&#x27;, &#x27;ou&#x27;, &#x27;createdAt&#x27;])
        &amp;&amp; (!(&#x27;ou&#x27; in request.resource.data) || (request.auth != null &amp;&amp; request.resource.data.ou == request.auth.uid))
        &amp;&amp; (!(&#x27;oh&#x27; in request.resource.data)
            || (request.resource.data.oh is string &amp;&amp; request.resource.data.oh.size() == 64))
        &amp;&amp; request.resource.data.name is string
        &amp;&amp; request.resource.data.name.size() &gt;= 1
        &amp;&amp; request.resource.data.name.size() &lt;= 30
        &amp;&amp; request.resource.data.createdAt == request.time;
      allow update: if (resource.data.get(&#x27;deleted&#x27;, false) == false
        &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;deleted&#x27;, &#x27;name&#x27;, &#x27;k&#x27;])
        &amp;&amp; request.resource.data.deleted == true
        &amp;&amp; request.resource.data.name == &#x27;&#x27;
        &amp;&amp; request.resource.data.k is string
        &amp;&amp; (!(&#x27;oh&#x27; in resource.data)
            || hashing.sha256(request.resource.data.k).toHexString().lower() == resource.data.oh))
        || (resource.data.get(&#x27;deleted&#x27;, false) == false
          &amp;&amp; !(&#x27;ou&#x27; in resource.data) &amp;&amp; (&#x27;oh&#x27; in resource.data)
          &amp;&amp; request.auth != null
          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;ou&#x27;])
          &amp;&amp; request.resource.data.ou == request.auth.uid
          &amp;&amp; getAfter(/databases/$(database)/documents/rooms/$(roomKey)/private/owner).data.uid == request.auth.uid)
        || (isAdmin() &amp;&amp; resource.data.get(&#x27;deleted&#x27;, false) == false
          &amp;&amp; resource.data.get(&#x27;createdAt&#x27;, request.time) &lt; request.time - duration.value(7, &#x27;d&#x27;)
          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;deleted&#x27;, &#x27;name&#x27;])
          &amp;&amp; request.resource.data.deleted == true &amp;&amp; request.resource.data.name == &#x27;&#x27;)
        || (resource.data.get(&#x27;deleted&#x27;, false) == false &amp;&amp; isMember(roomKey) &amp;&amp; isOwner(roomKey)
          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;oh&#x27;])
          &amp;&amp; request.resource.data.oh is string &amp;&amp; request.resource.data.oh.size() == 64)
        || (resource.data.get(&#x27;deleted&#x27;, false) == false &amp;&amp; isMember(roomKey) &amp;&amp; isOwner(roomKey)
          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;po&#x27;])
          &amp;&amp; (!(&#x27;po&#x27; in request.resource.data)
              || (request.resource.data.po is string &amp;&amp; request.resource.data.po != request.auth.uid
                &amp;&amp; get(/databases/$(database)/documents/rooms/$(roomKey)/members/$(request.resource.data.po)).data.get(&#x27;on&#x27;, false) == true)))
        || (resource.data.get(&#x27;po&#x27;, &#x27;&#x27;) == request.auth.uid
          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;po&#x27;])
          &amp;&amp; !(&#x27;po&#x27; in request.resource.data))
        || (resource.data.get(&#x27;deleted&#x27;, false) == false &amp;&amp; isMember(roomKey)
          &amp;&amp; (&#x27;ou&#x27; in resource.data)
          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;ou&#x27;, &#x27;oh&#x27;, &#x27;po&#x27;])
          &amp;&amp; request.resource.data.ou == request.auth.uid
          &amp;&amp; request.resource.data.oh is string &amp;&amp; request.resource.data.oh.size() == 64
          &amp;&amp; !(&#x27;po&#x27; in request.resource.data)
          &amp;&amp; (resource.data.get(&#x27;po&#x27;, &#x27;&#x27;) == request.auth.uid || ownerGone(roomKey, resource.data.ou)));
      match /private/{doc} {
        allow read, update: if false;
        allow delete: if roomDeleted(roomKey);
        allow create: if doc == &#x27;owner&#x27; &amp;&amp; roomAlive(roomKey)
          &amp;&amp; request.auth != null
          &amp;&amp; request.resource.data.keys().hasOnly([&#x27;k&#x27;, &#x27;uid&#x27;])
          &amp;&amp; request.resource.data.uid == request.auth.uid
          &amp;&amp; request.resource.data.k is string
          &amp;&amp; hashing.sha256(request.resource.data.k).toHexString().lower() == get(/databases/$(database)/documents/rooms/$(roomKey)).data.get(&#x27;oh&#x27;, &#x27;&#x27;);
      }
      match /members/{uid} {
        allow get: if request.auth != null &amp;&amp; request.auth.uid == uid;
        allow read: if canUse(roomKey) || isAdmin();
        allow create: if roomAlive(roomKey)
          &amp;&amp; request.auth != null &amp;&amp; request.auth.uid == uid
          &amp;&amp; request.resource.data.keys().hasOnly([&#x27;nick&#x27;, &#x27;on&#x27;, &#x27;joinedAt&#x27;])
          &amp;&amp; nickOk(request.resource.data.nick)
          &amp;&amp; request.resource.data.on == true
          &amp;&amp; request.resource.data.joinedAt == request.time;
        allow update: if roomAlive(roomKey) &amp;&amp; request.auth != null &amp;&amp; (
          (request.auth.uid == uid &amp;&amp; resource.data.on == true
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;nick&#x27;, &#x27;seen&#x27;, &#x27;br&#x27;])
            &amp;&amp; nickOk(request.resource.data.nick)
            &amp;&amp; (!(&#x27;br&#x27; in request.resource.data) || request.resource.data.br in [&#x27;kakao&#x27;, &#x27;insta&#x27;, &#x27;naver&#x27;, &#x27;band&#x27;, &#x27;inapp&#x27;, &#x27;home&#x27;, &#x27;chrome&#x27;, &#x27;safari&#x27;, &#x27;samsung&#x27;, &#x27;whale&#x27;, &#x27;other&#x27;])
            &amp;&amp; (!request.resource.data.diff(resource.data).affectedKeys().hasAny([&#x27;seen&#x27;]) || request.resource.data.seen == request.time))
          || (isOwner(roomKey) &amp;&amp; request.auth.uid != uid &amp;&amp; resource.data.on == true
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;on&#x27;, &#x27;kickedAt&#x27;])
            &amp;&amp; request.resource.data.on == false
            &amp;&amp; (!(&#x27;kickedAt&#x27; in request.resource.data) || request.resource.data.kickedAt == request.time))
          || (isOwner(roomKey) &amp;&amp; request.auth.uid != uid &amp;&amp; resource.data.on == false &amp;&amp; !(&#x27;kickedAt&#x27; in resource.data)
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;kickedAt&#x27;])
            &amp;&amp; request.resource.data.kickedAt == request.time)
          || (request.auth.uid == uid &amp;&amp; resource.data.on == false
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;nick&#x27;, &#x27;ap&#x27;])
            &amp;&amp; request.resource.data.nick == &#x27;(정보 지움)&#x27; &amp;&amp; !(&#x27;ap&#x27; in request.resource.data))
          || (request.auth.uid == uid &amp;&amp; resource.data.on == false
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;ap&#x27;, &#x27;apAt&#x27;])
            &amp;&amp; request.resource.data.ap is string &amp;&amp; request.resource.data.ap.size() &gt; 0 &amp;&amp; request.resource.data.ap.size() &lt;= 200
            &amp;&amp; request.resource.data.apAt == request.time
            &amp;&amp; (!(&#x27;apAt&#x27; in resource.data) || request.time &gt; resource.data.apAt + duration.value(1, &#x27;h&#x27;)))
          || (isOwner(roomKey) &amp;&amp; request.auth.uid != uid &amp;&amp; resource.data.on == false
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;ap&#x27;])
            &amp;&amp; !(&#x27;ap&#x27; in request.resource.data)));
        allow delete: if roomDeleted(roomKey)
          || (request.auth != null &amp;&amp; request.auth.uid == uid &amp;&amp; resource.data.on == true)
          || (canUse(roomKey) &amp;&amp; isOwner(roomKey) &amp;&amp; request.auth.uid != uid);
      }
      match /joinlog/{uid} {
        allow get: if request.auth != null &amp;&amp; request.auth.uid == uid;
        allow read: if isAdmin();
        allow create: if roomAlive(roomKey) &amp;&amp; request.auth != null &amp;&amp; request.auth.uid == uid
          &amp;&amp; isMember(roomKey)
          &amp;&amp; request.resource.data.keys().hasOnly([&#x27;at&#x27;])
          &amp;&amp; request.resource.data.at == get(meDoc(roomKey)).data.joinedAt;
      }
      match /opinions/{id} {
        allow read: if canUse(roomKey) || isAdmin();
        allow delete: if roomDeleted(roomKey) || expired() || (canUse(roomKey) &amp;&amp; isOwner(roomKey));
        allow create: if canUse(roomKey)
          &amp;&amp; request.resource.data.keys().hasOnly([&#x27;topic&#x27;, &#x27;text&#x27;, &#x27;play&#x27;, &#x27;date&#x27;, &#x27;slot&#x27;, &#x27;end&#x27;, &#x27;host&#x27;, &#x27;uid&#x27;, &#x27;expireAt&#x27;, &#x27;createdAt&#x27;])
          &amp;&amp; request.resource.data.uid == request.auth.uid
          &amp;&amp; request.resource.data.host == myNick(roomKey)
          &amp;&amp; expireOk(request.resource.data)
          &amp;&amp; request.resource.data.topic in [&#x27;habit&#x27;, &#x27;dev&#x27;, &#x27;meet&#x27;, &#x27;free&#x27;]
          &amp;&amp; request.resource.data.text is string
          &amp;&amp; request.resource.data.text.size() &gt; 0
          &amp;&amp; request.resource.data.text.size() &lt;= 500
          &amp;&amp; (!(&#x27;play&#x27; in request.resource.data)
              || (request.resource.data.play is string &amp;&amp; request.resource.data.play.size() &lt;= 40))
          &amp;&amp; (!(&#x27;date&#x27; in request.resource.data)
              || (request.resource.data.date is string &amp;&amp; request.resource.data.date.matches(&#x27;^[0-9]{4}-[0-9]{2}-[0-9]{2}$&#x27;)))
          &amp;&amp; (!(&#x27;slot&#x27; in request.resource.data)
              || request.resource.data.slot in [&#x27;9시&#x27;, &#x27;10시&#x27;, &#x27;11시&#x27;, &#x27;12시&#x27;, &#x27;13시&#x27;, &#x27;14시&#x27;, &#x27;15시&#x27;, &#x27;16시&#x27;, &#x27;17시&#x27;, &#x27;18시&#x27;, &#x27;19시&#x27;, &#x27;20시&#x27;])
          &amp;&amp; (!(&#x27;end&#x27; in request.resource.data)
              || request.resource.data.end in [&#x27;10시&#x27;, &#x27;11시&#x27;, &#x27;12시&#x27;, &#x27;13시&#x27;, &#x27;14시&#x27;, &#x27;15시&#x27;, &#x27;16시&#x27;, &#x27;17시&#x27;, &#x27;18시&#x27;, &#x27;19시&#x27;, &#x27;20시&#x27;, &#x27;21시&#x27;, &#x27;22시&#x27;])
          &amp;&amp; (!(&#x27;host&#x27; in request.resource.data)
              || (request.resource.data.host is string &amp;&amp; request.resource.data.host.size() &gt; 0 &amp;&amp; request.resource.data.host.size() &lt;= 20))
          &amp;&amp; request.resource.data.createdAt == request.time;
        function voteMine() {
          let nv = request.resource.data.get(&#x27;v&#x27;, {});
          let me = request.auth.uid;
          return request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;v&#x27;])
            &amp;&amp; nv.diff(resource.data.get(&#x27;v&#x27;, {})).affectedKeys().hasOnly([me])
            &amp;&amp; (!(me in nv)
                || (nv[me] is map &amp;&amp; nv[me].keys().hasOnly([&#x27;s&#x27;, &#x27;n&#x27;])
                    &amp;&amp; nv[me].s in [&#x27;join&#x27;, &#x27;maybe&#x27;, &#x27;no&#x27;] &amp;&amp; nv[me].n == myNick(roomKey)));
        }
        allow update: if canUse(roomKey) &amp;&amp; (
          (request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;cancelled&#x27;])
            &amp;&amp; request.resource.data.cancelled == true &amp;&amp; resource.data.topic == &#x27;meet&#x27;
            &amp;&amp; (resource.data.get(&#x27;uid&#x27;, &#x27;&#x27;) == &#x27;&#x27; || resource.data.uid == request.auth.uid || isOwner(roomKey)))
          || voteMine()
          || (resource.data.get(&#x27;uid&#x27;, &#x27;&#x27;) == request.auth.uid &amp;&amp; resource.data.topic == &#x27;meet&#x27; &amp;&amp; !resource.data.get(&#x27;cancelled&#x27;, false)
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;text&#x27;, &#x27;date&#x27;, &#x27;slot&#x27;, &#x27;end&#x27;, &#x27;expireAt&#x27;])
            &amp;&amp; request.resource.data.text is string &amp;&amp; request.resource.data.text.size() &gt; 0 &amp;&amp; request.resource.data.text.size() &lt;= 500
            &amp;&amp; request.resource.data.date is string &amp;&amp; request.resource.data.date.matches(&#x27;^[0-9]{4}-[0-9]{2}-[0-9]{2}$&#x27;)
            &amp;&amp; request.resource.data.slot in [&#x27;9시&#x27;, &#x27;10시&#x27;, &#x27;11시&#x27;, &#x27;12시&#x27;, &#x27;13시&#x27;, &#x27;14시&#x27;, &#x27;15시&#x27;, &#x27;16시&#x27;, &#x27;17시&#x27;, &#x27;18시&#x27;, &#x27;19시&#x27;, &#x27;20시&#x27;]
            &amp;&amp; (!(&#x27;end&#x27; in request.resource.data) || request.resource.data.end in [&#x27;10시&#x27;, &#x27;11시&#x27;, &#x27;12시&#x27;, &#x27;13시&#x27;, &#x27;14시&#x27;, &#x27;15시&#x27;, &#x27;16시&#x27;, &#x27;17시&#x27;, &#x27;18시&#x27;, &#x27;19시&#x27;, &#x27;20시&#x27;, &#x27;21시&#x27;, &#x27;22시&#x27;])
            &amp;&amp; expireOk(request.resource.data)));
        match /comments/{cid} {
          function meetGone() {
            let p = /databases/$(database)/documents/rooms/$(roomKey)/opinions/$(id);
            return !exists(p) || (get(p).data.get(&#x27;expireAt&#x27;, null) is timestamp &amp;&amp; get(p).data.expireAt &lt; request.time);
          }
          allow read: if canUse(roomKey) || isAdmin();
          allow delete: if roomDeleted(roomKey) || expired() || (canUse(roomKey) &amp;&amp; (isOwner(roomKey) || meetGone()));
          allow create: if canUse(roomKey)
            &amp;&amp; request.resource.data.keys().hasOnly([&#x27;text&#x27;, &#x27;createdAt&#x27;, &#x27;kh&#x27;, &#x27;uid&#x27;, &#x27;n&#x27;, &#x27;expireAt&#x27;, &#x27;to&#x27;])
            &amp;&amp; request.resource.data.uid == request.auth.uid
            &amp;&amp; request.resource.data.n == myNick(roomKey)
            &amp;&amp; expireOk(request.resource.data)
            &amp;&amp; (!(&#x27;to&#x27; in request.resource.data)
                || (request.resource.data.to is string &amp;&amp; request.resource.data.to.size() &gt;= 1 &amp;&amp; request.resource.data.to.size() &lt;= 40))
            &amp;&amp; request.resource.data.text is string
            &amp;&amp; request.resource.data.text.size() &gt; 0
            &amp;&amp; request.resource.data.text.size() &lt;= 300
            &amp;&amp; (!(&#x27;kh&#x27; in request.resource.data)
                || (request.resource.data.kh is string &amp;&amp; request.resource.data.kh.size() == 64))
            &amp;&amp; request.resource.data.createdAt == request.time;
          allow update: if canUse(roomKey)
            &amp;&amp; resource.data.get(&#x27;kh&#x27;, &#x27;&#x27;) != &#x27;&#x27;
            &amp;&amp; resource.data.get(&#x27;deleted&#x27;, false) == false
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;text&#x27;, &#x27;k&#x27;, &#x27;kh&#x27;, &#x27;deleted&#x27;, &#x27;editedAt&#x27;])
            &amp;&amp; request.resource.data.k is string
            &amp;&amp; hashing.sha256(request.resource.data.k).toHexString().lower() == resource.data.kh
            &amp;&amp; request.resource.data.kh is string
            &amp;&amp; request.resource.data.kh.size() == 64
            &amp;&amp; request.resource.data.kh != resource.data.kh
            &amp;&amp; request.resource.data.text is string
            &amp;&amp; request.resource.data.text.size() &lt;= 300
            &amp;&amp; ((request.resource.data.get(&#x27;deleted&#x27;, false) == true &amp;&amp; request.resource.data.text == &#x27;&#x27;)
                || (request.resource.data.get(&#x27;deleted&#x27;, false) == false &amp;&amp; request.resource.data.text.size() &gt; 0))
            &amp;&amp; request.resource.data.editedAt == request.time;
        }
      }

          &amp;&amp; request.resource.data.createdAt == request.time
          &amp;&amp; request.resource.data.expireAt is timestamp

          allow create: if canUse(roomKey)
            &amp;&amp; exists(photo())
            &amp;&amp; request.resource.data.keys().hasOnly([&#x27;text&#x27;, &#x27;uid&#x27;, &#x27;n&#x27;, &#x27;to&#x27;, &#x27;createdAt&#x27;, &#x27;expireAt&#x27;])
            &amp;&amp; request.resource.data.uid == request.auth.uid
            &amp;&amp; request.resource.data.n == myNick(roomKey)
            &amp;&amp; request.resource.data.text is string
            &amp;&amp; request.resource.data.text.size() &gt; 0
            &amp;&amp; request.resource.data.text.size() &lt;= 300
            &amp;&amp; (!(&#x27;to&#x27; in request.resource.data)
                || (request.resource.data.to is string &amp;&amp; request.resource.data.to.size() &gt;= 1 &amp;&amp; request.resource.data.to.size() &lt;= 40))
            &amp;&amp; request.resource.data.createdAt == request.time
            &amp;&amp; request.resource.data.expireAt is timestamp
            &amp;&amp; request.resource.data.expireAt &lt;= request.time + duration.value(32, &#x27;d&#x27;);

          &amp;&amp; request.resource.data.t is string &amp;&amp; request.resource.data.t.size() &gt; 0 &amp;&amp; request.resource.data.t.size() &lt;= 40

          &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;t&#x27;, &#x27;b&#x27;, &#x27;deleted&#x27;, &#x27;k&#x27;])
          &amp;&amp; request.resource.data.k is string
          &amp;&amp; hashing.sha256(request.resource.data.k).toHexString().lower() == resource.data.kh
          &amp;&amp; request.resource.data.t == &#x27;&#x27; &amp;&amp; request.resource.data.b == &#x27;&#x27; &amp;&amp; request.resource.data.deleted == true;
        allow delete: if roomDeleted(roomKey) || expired() || (canUse(roomKey) &amp;&amp; isOwner(roomKey));

            &amp;&amp; exists(post()) &amp;&amp; get(post()).data.get(&#x27;deleted&#x27;, false) == false
            &amp;&amp; request.resource.data.keys().hasOnly([&#x27;b&#x27;, &#x27;kh&#x27;, &#x27;createdAt&#x27;, &#x27;expireAt&#x27;])
            &amp;&amp; request.resource.data.b is string &amp;&amp; request.resource.data.b.size() &gt; 0 &amp;&amp; request.resource.data.b.size() &lt;= 300
            &amp;&amp; request.resource.data.kh is string &amp;&amp; request.resource.data.kh.size() == 64
            &amp;&amp; request.resource.data.createdAt == request.time
            &amp;&amp; request.resource.data.expireAt is timestamp
            &amp;&amp; request.resource.data.expireAt &lt;= request.time + duration.value(32, &#x27;d&#x27;);
          allow update: if request.auth != null
            &amp;&amp; resource.data.get(&#x27;deleted&#x27;, false) == false
            &amp;&amp; request.resource.data.diff(resource.data).affectedKeys().hasOnly([&#x27;b&#x27;, &#x27;deleted&#x27;, &#x27;k&#x27;])
            &amp;&amp; request.resource.data.k is string
            &amp;&amp; hashing.sha256(request.resource.data.k).toHexString().lower() == resource.data.kh
            &amp;&amp; request.resource.data.b == &#x27;&#x27; &amp;&amp; request.resource.data.deleted == true;

<script>
const T = document.getElementById('t'), RAW = T.value, U = document.getElementById('uid');
try{ U.value = localStorage.getItem('sosAdminUid') || ''; }catch(e){}
const clean = () => U.value.replace(/[^A-Za-z0-9]/g, '');
const fill = () => { const u = clean(); T.value = u ? RAW.replace("'여기에_내_번호'", "'" + u + "'") : RAW;
  const l = T.value.split('\n').find(x => x.includes('request.auth.uid in [')) || '';
  document.getElementById('line28').textContent = '28번째 줄 미리보기 → ' + l.trim(); };
U.addEventListener('input', () => { fill(); try{ localStorage.setItem('sosAdminUid', U.value.trim()); }catch(e){} }); fill();
document.getElementById('copy').addEventListener('click', async () => {
  const ok = document.getElementById('ok');
  if(!/^[A-Za-z0-9]{20,40}$/.test(clean())){ ok.textContent = '⚠️ 내 번호를 확인해 주세요 (영문·숫자 20~40자, admin.html 의 번호를 그대로 복사)'; U.focus(); return; }
  fill();
  try{ await navigator.clipboard.writeText(T.value); }
  catch(e){ T.focus(); T.select(); document.execCommand('copy'); }
  ok.textContent = '✅ ' + T.value.split('\n').length + '줄 복사했어요! 콘솔에 붙여넣고 게시하세요.';
});
</script>
